<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XivMind API Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --accent-color: #0d6efd;
            --get-color: #198754;
            --post-color: #0d6efd;
            --put-color: #fd7e14;
            --delete-color: #dc3545;
            --patch-color: #6f42c1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a2e;
                --bg-secondary: #16213e;
                --bg-tertiary: #0f3460;
                --text-primary: #eaeaea;
                --text-secondary: #a0a0a0;
                --border-color: #2d3748;
                --accent-color: #4dabf7;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 380px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h1 svg {
            width: 28px;
            height: 28px;
            color: var(--accent-color);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .api-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .api-group {
            margin-bottom: 15px;
        }

        .api-group-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 8px 12px;
            letter-spacing: 0.5px;
        }

        .api-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            gap: 10px;
            margin-bottom: 4px;
        }

        .api-item:hover {
            background: var(--bg-tertiary);
        }

        .api-item.active {
            background: var(--accent-color);
            color: white;
        }

        .api-item.active .method-badge {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .method-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 55px;
            text-align: center;
        }

        .method-GET { background: rgba(25, 135, 84, 0.15); color: var(--get-color); }
        .method-POST { background: rgba(13, 110, 253, 0.15); color: var(--post-color); }
        .method-PUT { background: rgba(253, 126, 20, 0.15); color: var(--put-color); }
        .method-DELETE { background: rgba(220, 53, 69, 0.15); color: var(--delete-color); }
        .method-PATCH { background: rgba(111, 66, 193, 0.15); color: var(--patch-color); }

        .api-path {
            flex: 1;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .detail-panel {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .welcome-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .welcome-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .endpoint-header {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .endpoint-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .endpoint-title .method-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .endpoint-title .path {
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .endpoint-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title svg {
            width: 18px;
            height: 18px;
        }

        .params-form {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .param-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .param-row:last-child {
            margin-bottom: 0;
        }

        .param-name {
            min-width: 150px;
            font-weight: 500;
            font-size: 0.9rem;
            padding-top: 8px;
        }

        .param-required {
            color: var(--delete-color);
            font-size: 0.75rem;
            margin-left: 5px;
        }

        .param-type {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
        }

        .param-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }

        .param-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .param-input::placeholder {
            color: var(--text-secondary);
        }

        textarea.param-input {
            min-height: 120px;
            resize: vertical;
        }

        .btn-send {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
        }

        .btn-send.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .response-section {
            margin-top: 25px;
        }

        .response-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .response-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-2xx { background: rgba(25, 135, 84, 0.15); color: var(--get-color); }
        .status-3xx { background: rgba(253, 126, 20, 0.15); color: var(--put-color); }
        .status-4xx { background: rgba(220, 53, 69, 0.15); color: var(--delete-color); }
        .status-5xx { background: rgba(220, 53, 69, 0.15); color: var(--delete-color); }

        .response-time {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .btn-copy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-copy:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-copy svg {
            width: 14px;
            height: 14px;
        }

        .response-body {
            background: #0d1117;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        .response-body pre {
            margin: 0;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            color: #c9d1d9;
        }

        .no-response {
            color: var(--text-secondary);
            font-style: italic;
            text-align: center;
            padding: 40px;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--delete-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--delete-color);
            margin-bottom: 20px;
        }

        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        .empty-params {
            color: var(--text-secondary);
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
            }

            .param-row {
                flex-direction: column;
            }

            .param-name {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    XivMind API Tester
                </h1>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search APIs...">
                </div>
            </div>
            <div class="api-list" id="apiList">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    Loading APIs...
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="detail-panel" id="detailPanel">
                <div class="welcome-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <h3>Select an API to Test</h3>
                    <p>Choose an API from the list to view details and send test requests</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '';
        let apiData = { grouped: {}, endpoints: [] };
        let selectedEndpoint = null;
        let requestHistory = [];

        async function loadAPIs() {
            try {
                const response = await fetch('/api/schema');
                if (!response.ok) {
                    throw new Error('Failed to fetch API schema');
                }
                apiData = await response.json();
                renderAPIs(apiData.grouped);
            } catch (error) {
                document.getElementById('apiList').innerHTML = `
                    <div class="error-message">
                        <strong>Error loading APIs</strong>
                        <p>${error.message}</p>
                        <p>Make sure the main XivMind application is running on port 8000</p>
                    </div>
                `;
            }
        }

        function renderAPIs(grouped) {
            const container = document.getElementById('apiList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let html = '';
            let hasResults = false;

            for (const [tag, endpoints] of Object.entries(grouped)) {
                const filtered = endpoints.filter(ep => 
                    !searchTerm || 
                    ep.path.toLowerCase().includes(searchTerm) ||
                    ep.summary.toLowerCase().includes(searchTerm) ||
                    ep.method.toLowerCase().includes(searchTerm)
                );

                if (filtered.length > 0) {
                    hasResults = true;
                    html += `<div class="api-group">
                        <div class="api-group-title">${tag}</div>`;
                    
                    for (const ep of filtered) {
                        html += `<div class="api-item" onclick="selectEndpoint('${ep.path}', '${ep.method}')">
                            <span class="method-badge method-${ep.method}">${ep.method}</span>
                            <span class="api-path">${ep.path}</span>
                        </div>`;
                    }
                    
                    html += '</div>';
                }
            }

            if (!hasResults) {
                html = '<div class="empty-params">No APIs found</div>';
            }

            container.innerHTML = html;
        }

        function selectEndpoint(path, method) {
            const endpoint = apiData.endpoints.find(ep => ep.path === path && ep.method === method);
            if (!endpoint) return;

            selectedEndpoint = endpoint;
            
            document.querySelectorAll('.api-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const activeItem = document.querySelector(`.api-item[onclick="selectEndpoint('${path}', '${method}')"]`);
            if (activeItem) {
                activeItem.classList.add('active');
            }

            renderEndpointDetail(endpoint);
        }

        function renderEndpointDetail(endpoint) {
            const panel = document.getElementById('detailPanel');
            
            let paramsHtml = '';
            if (endpoint.parameters && endpoint.parameters.length > 0) {
                paramsHtml = '<div class="params-form">';
                for (const param of endpoint.parameters) {
                    const paramType = param.schema?.type || 'string';
                    const required = param.required ? '<span class="param-required">*</span>' : '';
                    const defaultValue = param.schema?.default || '';
                    
                    paramsHtml += `<div class="param-row">
                        <div class="param-name">
                            ${param.name}
                            <span class="param-type">${paramType}</span>
                            ${required}
                        </div>
                        <input type="text" 
                               class="param-input" 
                               data-param-name="${param.name}" 
                               data-param-in="${param.in}"
                               placeholder="${param.description || 'Enter value...'}"
                               value="${defaultValue}">
                    </div>`;
                }
                paramsHtml += '</div>';
            } else {
                paramsHtml = '<div class="params-form"><div class="empty-params">No parameters required</div></div>';
            }

            let bodyHtml = '';
            if (endpoint.requestBody) {
                const content = endpoint.requestBody.content;
                const jsonContent = content?.['application/json'];
                if (jsonContent) {
                    const schema = jsonContent.schema;
                    const example = generateExample(schema);
                    bodyHtml = `<div class="params-form">
                        <div class="section-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            </svg>
                            Request Body (JSON)
                        </div>
                        <div class="param-row">
                            <textarea class="param-input" id="requestBody" placeholder="Enter JSON body...">${example}</textarea>
                        </div>
                    </div>`;
                }
            }

            const description = endpoint.description || endpoint.summary || 'No description available';

            panel.innerHTML = `
                <div class="endpoint-header">
                    <div class="endpoint-title">
                        <span class="method-badge method-${endpoint.method}">${endpoint.method}</span>
                        <span class="path">${endpoint.path}</span>
                    </div>
                    <p class="endpoint-description">${description}</p>
                </div>

                <div class="section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/>
                    </svg>
                    Parameters
                </div>
                ${paramsHtml}
                ${bodyHtml}

                <button class="btn-send" id="sendBtn" onclick="sendRequest()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Send Request
                </button>

                <div class="response-section" id="responseSection">
                    <div class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Response
                    </div>
                    <div class="no-response">Click "Send Request" to test this API</div>
                </div>
            `;
        }

        function generateExample(schema) {
            if (!schema) return '{}';
            
            if (schema.type === 'object' && schema.properties) {
                const obj = {};
                for (const [key, prop] of Object.entries(schema.properties)) {
                    obj[key] = generateExample(prop);
                }
                return JSON.stringify(obj, null, 2);
            }
            
            if (schema.type === 'array' && schema.items) {
                return JSON.stringify([generateExample(schema.items)], null, 2);
            }
            
            if (schema.example) {
                return JSON.stringify(schema.example, null, 2);
            }
            
            const typeExamples = {
                string: '"example"',
                integer: 123,
                number: 123.45,
                boolean: true,
                object: '{}',
                array: '[]'
            };
            
            return typeExamples[schema.type] || '"value"';
        }

        async function sendRequest() {
            if (!selectedEndpoint) return;

            const btn = document.getElementById('sendBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            const params = {};
            document.querySelectorAll('.param-input[data-param-name]').forEach(input => {
                const name = input.dataset.paramName;
                const paramIn = input.dataset.paramIn;
                if (input.value) {
                    if (!params[paramIn]) params[paramIn] = {};
                    params[paramIn][name] = input.value;
                }
            });

            let url = selectedEndpoint.path;
            
            if (params.path) {
                for (const [key, value] of Object.entries(params.path)) {
                    url = url.replace(`{${key}}`, encodeURIComponent(value));
                }
            }

            let body = null;
            const bodyTextarea = document.getElementById('requestBody');
            if (bodyTextarea && bodyTextarea.value) {
                try {
                    body = bodyTextarea.value;
                } catch (e) {
                    alert('Invalid JSON in request body');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    return;
                }
            }

            const queryParams = new URLSearchParams();
            if (params.query) {
                for (const [key, value] of Object.entries(params.query)) {
                    queryParams.append(key, value);
                }
            }
            const queryString = queryParams.toString();
            const fullUrl = queryString ? `${url}?${queryString}` : url;

            const startTime = Date.now();

            try {
                const response = await fetch(`/proxy${fullUrl}`, {
                    method: selectedEndpoint.method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: body
                });

                const duration = Date.now() - startTime;
                const responseData = await response.json();
                
                let responseBody = responseData.body;
                try {
                    responseBody = JSON.parse(responseData.body);
                    responseBody = JSON.stringify(responseBody, null, 2);
                } catch (e) {
                    // Keep original text if not JSON
                }

                const statusClass = responseData.status_code >= 200 && responseData.status_code < 300 ? 'status-2xx' :
                                   responseData.status_code >= 300 && responseData.status_code < 400 ? 'status-3xx' :
                                   responseData.status_code >= 400 && responseData.status_code < 500 ? 'status-4xx' : 'status-5xx';

                document.getElementById('responseSection').innerHTML = `
                    <div class="response-header">
                        <div class="response-status">
                            <span class="status-badge ${statusClass}">${responseData.status_code}</span>
                            <span class="response-time">${duration}ms</span>
                        </div>
                        <button class="btn-copy" onclick="copyResponse()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <div class="response-body">
                        <pre><code class="language-json" id="responseCode">${escapeHtml(responseBody)}</code></pre>
                    </div>
                `;

                hljs.highlightElement(document.getElementById('responseCode'));

            } catch (error) {
                document.getElementById('responseSection').innerHTML = `
                    <div class="error-message">
                        <strong>Request Failed</strong>
                        <p>${error.message}</p>
                    </div>
                `;
            }

            btn.classList.remove('loading');
            btn.disabled = false;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyResponse() {
            const code = document.getElementById('responseCode');
            if (code) {
                navigator.clipboard.writeText(code.textContent).then(() => {
                    const btn = document.querySelector('.btn-copy');
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg> Copy`;
                    }, 2000);
                });
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderAPIs(apiData.grouped);
        });

        loadAPIs();
    </script>
</body>
</html>
